name: CompatHelper

# Opens a pull request whenever a dependency of a checker releases a version
# outside its [compat] bounds. check.yml then runs the "latest" job on that
# pull request: green means the proof still passes with the new version,
# red means the checker is out of sync.
#
# Every checker/ directory in the repository is watched.
#
# Note: pull requests opened with the default GITHUB_TOKEN do not trigger other
# workflows. For check.yml to run on CompatHelper's PRs automatically, add an
# SSH deploy key as described at
# https://juliaregistries.github.io/CompatHelper.jl/dev/#Creating-SSH-Key
# and store its private half as the secret COMPATHELPER_PRIV. Without it, the PRs
# still appear; close and reopen one to trigger the checks.

on:
  schedule:
    - cron: '41 4 * * 1'      # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Find checker environments
        id: dirs
        run: |
          dirs=$(find . -path ./.git -prune -o -type f -path '*/checker/Project.toml' -printf '%h\n' | sed 's|^\./||' | sort | jq -R . | jq -cs .)
          echo "subdirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "watching: $dirs"
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs = ${{ steps.dirs.outputs.subdirs }})'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
